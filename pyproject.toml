[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay"
version = "0.1.0"
description = "Plex library health checker and 'why is this transcoding?' diagnostic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
assay = "assay.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
