id = "plex-web"
name = "Plex Web (Chrome/Edge)"
notes = """
Starter profile, not yet verified against Plex decisions. Browsers are the
most restrictive Plex client: no AC3/EAC3/DTS/TrueHD, no MKV container, and
HEVC depends on hardware support.
"""

match_products = ["Plex Web"]

containers = ["mp4", "mov"]
subtitles = ["srt", "webvtt", "mov_text", "ass"]
hdr = []
dovi_profiles = []

[video.h264]
max_bit_depth = 8
max_level = 52

[video.vp9]
max_bit_depth = 8

[video.av1]
max_bit_depth = 8

[audio.aac]
max_channels = 6

[audio.mp3]
max_channels = 2

[audio.opus]
max_channels = 6

[audio.flac]
max_channels = 2
